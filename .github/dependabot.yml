version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    target-branch: dev

  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    target-branch: dev

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    target-branch: dev
