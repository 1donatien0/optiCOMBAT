name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Couverture lignes .NET : plancher bloquant / cible progressive (voir CONTRIBUTING.md)
  COVERAGE_FLOOR: "0.85"
  COVERAGE_TARGET: "0.90"
  # Couverture lignes Rust (cargo-llvm-cov, en %) : plancher bloquant / cible
  RUST_COVERAGE_FLOOR: "90"
  RUST_COVERAGE_TARGET: "95"

jobs:
  format:
    name: Format (C# + Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: dotnet format (espaces, encodage, fin de fichier)
        run: >
          dotnet format whitespace . --folder --verify-no-changes
          --exclude engine native tools publish artifacts installer

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check --manifest-path engine/Cargo.toml

  dotnet:
    name: .NET tests + couverture
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Thèmes WinUI (clés identiques, pas de StaticResource)
        shell: pwsh
        run: .\scripts\check-winui-theme-keys.ps1

      - name: Runtime deps (ClamAV + YARA)
        shell: pwsh
        run: .\scripts\fetch-runtime-deps.ps1

      - name: Build (Release, warnings = erreurs)
        run: dotnet build optiCombat.sln -c Release

      - name: dotnet test (Release + couverture)
        run: >
          dotnet test optiCombat.Tests\optiCombat.Tests.csproj -c Release --no-build
          --settings optiCombat.Tests\coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Couverture — seuil
        if: always()
        shell: pwsh
        run: |
          $floor = [double]::Parse($env:COVERAGE_FLOOR, [Globalization.CultureInfo]::InvariantCulture)
          $target = [double]::Parse($env:COVERAGE_TARGET, [Globalization.CultureInfo]::InvariantCulture)
          $file = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $file) { Write-Error 'coverage.cobertura.xml introuvable'; exit 1 }
          [xml]$xml = Get-Content -LiteralPath $file.FullName
          $line = [double]::Parse($xml.coverage.'line-rate', [Globalization.CultureInfo]::InvariantCulture)
          $branch = [double]::Parse($xml.coverage.'branch-rate', [Globalization.CultureInfo]::InvariantCulture)
          $summary = "Couverture lignes {0:P1} (plancher {1:P0}, cible {2:P0}) · branches {3:P1}" -f $line, $floor, $target, $branch
          Write-Host $summary
          "### $summary" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ($line -lt $target) { Write-Host "::warning::Couverture sous la cible progressive." }
          if ($line -lt $floor) { Write-Error 'Couverture sous le plancher.'; exit 1 }

      - name: Artefacts tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          retention-days: 14

  rust:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo clippy (warnings = erreurs)
        run: cargo clippy --workspace --all-targets --manifest-path engine/Cargo.toml -- -D warnings

      - name: cargo test + couverture (llvm-cov)
        run: >
          cargo llvm-cov --workspace --manifest-path engine/Cargo.toml
          --lcov --output-path lcov.info
          --fail-under-lines ${{ env.RUST_COVERAGE_FLOOR }}

      - name: Couverture Rust — résumé
        if: always()
        shell: pwsh
        run: |
          $total = cargo llvm-cov report --manifest-path engine/Cargo.toml --summary-only | Select-String '^TOTAL' | Select-Object -Last 1
          if (-not $total) { Write-Host 'Résumé llvm-cov indisponible'; exit 0 }
          $cols = ($total.Line -split '\s+')
          $lines = $cols[9]
          $summary = "Couverture Rust lignes $lines (plancher $($env:RUST_COVERAGE_FLOOR) %, cible $($env:RUST_COVERAGE_TARGET) %)"
          Write-Host $summary
          "### $summary" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ([double]($lines.TrimEnd('%')) -lt [double]$env:RUST_COVERAGE_TARGET) { Write-Host "::warning::Couverture Rust sous la cible progressive." }

      - name: Artefact couverture Rust
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: lcov.info
          retention-days: 14

  rust-audit:
    name: Rust audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file engine/Cargo.lock

  publish:
    name: Publish win-x64 + SBOM (main)
    runs-on: windows-latest
    needs: [format, dotnet, rust]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dépendances Python (assets branding)
        run: python -m pip install pillow

      - name: Publish (sans tests ni installateur)
        shell: pwsh
        run: .\scripts\prepare-release.ps1 -SkipTests -SkipFreshclam -SkipInstaller

      - name: SBOM CycloneDX
        shell: pwsh
        run: .\scripts\generate-sbom.ps1 -OutputDir sbom

      - uses: actions/upload-artifact@v7
        with:
          name: optiCombat-win-x64-${{ github.sha }}
          path: optiCombat.WinUI/bin/Release/net8.0-windows10.0.19041.0/publish/win-x64/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 30
